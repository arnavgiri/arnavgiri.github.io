name: Site smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check index.js
          node --check app.js
          node --check study-ambient-sounds/app.js
          node --check typing-speed-test/app.js
          node --check age-calculator/app.js
          node --check password-generator/app.js
          node tests/password-generator.test.js
          node tests/age-calculator.test.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class InlineScript(HTMLParser):
              in_script = False
              collected = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script" and not dict(attrs).get("src"):
                      self.in_script = True
              def handle_endtag(self, tag):
                  if tag == "script": self.in_script = False
              def handle_data(self, data):
                  if self.in_script: self.collected.append(data)
          html = Path("study-focus-timer/index.html").read_text()
          parser = InlineScript()
          parser.feed(html)
          Path("/tmp/focus-inline.js").write_text("\n".join(parser.collected))
          PY
          node --check /tmp/focus-inline.js
      - name: Check local assets, links, and XML
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          import xml.etree.ElementTree as ET

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.anchors = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if "href" in d:
                      self.links.append(d["href"])
                      if tag == "a": self.anchors.append(d)
                  if "src" in d: self.links.append(d["src"])
                  if "srcset" in d:
                      self.links.extend(item.strip().split()[0] for item in d["srcset"].split(","))
                  if "imagesrcset" in d:
                      self.links.extend(item.strip().split()[0] for item in d["imagesrcset"].split(","))
          import json
          manifest = json.loads(Path("projects.json").read_text(encoding="utf-8"))
          folders = sorted(
              p for p in Path(".").iterdir()
              if p.is_dir() and not p.name.startswith(".") and
              p.name not in {"node_modules", "assets", "tests", "_site", "dist"} and
              (p / "index.html").is_file()
          )
          pages = [Path("index.html"), *(p / "index.html" for p in folders)]
          parsers = {}
          for page in pages:
              p = LinkParser()
              p.feed(page.read_text(encoding="utf-8"))
              parsers[str(page)] = p
              for link in p.links:
                  parsed = urlsplit(link)
                  if parsed.scheme or parsed.netloc or link.startswith(("mailto:", "#", "tel:", "data:")):
                      continue
                  relative = unquote(parsed.path)
                  if not relative: continue
                  path = (Path(".") / relative.lstrip("/")) if relative.startswith("/") else page.parent / relative
                  if path.is_dir(): path /= "index.html"
                  assert path.is_file(), f"Missing asset: {page} -> {link}"
              print(f"PASS {page} ({len(p.links)} references)")
          for page in pages[1:]:
              content = page.read_text(encoding="utf-8").lower()
              assert "https://biharkalyan.in" not in content, f"External brand link in {page}"
          home = parsers["index.html"]
          tool_links = [a for a in home.anchors if a.get("class") == "project"]
          assert len(tool_links) == len(manifest["projects"]) + len([
              p for p in folders if p.name not in
              {item.get("slug") for item in manifest["projects"]}
          ]), "Homepage project count does not match manifest and discovered tools"
          assert all(a.get("target") == "_blank" and "noopener" in a.get("rel", "") for a in tool_links)
          brand_links = [a for a in home.anchors if a.get("href", "").startswith("https://biharkalyan.in/")]
          assert len(brand_links) == 1, "Expected exactly one BiharKalyan link on homepage"
          rss = ET.parse("feed.xml")
          sitemap = ET.parse("sitemap.xml")
          expected_urls = {"https://arnavgiri.github.io/"} | {
              "https://arnavgiri.github.io/" + folder.name + "/" for folder in folders
          }
          rss_urls = {item.findtext("link") for item in rss.findall(".//item")}
          actual_sitemap = {node.text for node in sitemap.findall(
              ".//{http://www.sitemaps.org/schemas/sitemap/0.9}loc")}
          assert rss_urls == expected_urls, "RSS items do not match local pages"
          assert actual_sitemap == expected_urls, "Sitemap URLs do not match local pages"
          for path in ["robots.txt", "favicon.svg", "study-ambient-sounds/thunder.ogg"]:
              assert Path(path).is_file(), f"Missing file: {path}"
          print("PASS XML, homepage links, required assets and tool branding")
          PY
