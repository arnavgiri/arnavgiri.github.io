name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate homepage, RSS and sitemap
        run: npm run build
      - name: Verify generator and calculator
        run: npm test
      - name: Persist generated static files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html feed.xml sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Refresh generated homepage, RSS and sitemap"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify RSS WebSub hub
        continue-on-error: true
        run: |
          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST \
            --data-urlencode "hub.mode=publish" \
            --data-urlencode "hub.url=https://arnavgiri.github.io/feed.xml" \
            "https://pubsubhubbub.appspot.com/"

